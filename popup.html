<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Lead Extractor</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="popup-container">
        <header class="popup-header">
            <div class="logo">
                <span class="icon">🎯</span>
                <h1>Lead Extractor</h1>
            </div>
            <div class="version">v1.0</div>
        </header>

        <div class="stats-section">
            <div class="stat-card">
                <div class="stat-number" id="total-leads">0</div>
                <div class="stat-label">Total Leads</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="extraction-status">Ready</div>
                <div class="stat-label">Status</div>
            </div>
        </div>

        <div class="controls-section">
            <button id="refresh-data" class="btn btn-secondary">
                <span class="btn-icon">🔄</span>
                Refresh
            </button>
            <button id="download-csv" class="btn btn-primary" disabled>
                <span class="btn-icon">📥</span>
                Download CSV
            </button>
        </div>

        <div class="preview-section">
            <div class="section-header">
                <h3>Live Preview</h3>
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search leads...">
                    <span class="search-icon">🔍</span>
                </div>
            </div>
            
            <div class="leads-container" id="leads-container">
                <div class="empty-state" id="empty-state">
                    <div class="empty-icon">📍</div>
                    <h3>No leads found</h3>
                    <p>Visit Google Maps and search for businesses to start extracting leads.</p>
                </div>
            </div>
        </div>

        <div class="pagination" id="pagination" style="display: none;">
            <button id="prev-page" class="pagination-btn">‹ Previous</button>
            <span class="page-info">
                Page <span id="current-page">1</span> of <span id="total-pages">1</span>
            </span>
            <button id="next-page" class="pagination-btn">Next ›</button>
        </div>

        <footer class="popup-footer">
            <div class="footer-links">
                <a href="#" id="clear-all-data">Clear All Data</a>
                <a href="#" id="export-json">Export JSON</a>
            </div>
            <div class="footer-info">
                <span>Extracted from Google Maps</span>
            </div>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
